<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border:5px solid green;
            padding:20px;
            margin:100px;
            position:absolute;
            top:50px;
        }
    </style>
</head>
<body>
    <div>Java</div>
    <div>Javashdig</div>

    <form>
        <label for="name">First Name:</label>
        <input type="text" id="fname" name="fname"><br><br>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname"><br><br>

         <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Whatsapp number"><br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city"><br><br>

        <label for="lang">Languages known</label>
        <input type="checkbox" name="languages",value="Java">
        <label for="java">Java</label>
        
        <input type="checkbox" name="languages",value="Python">
        <label for="python">Python</label>
        
        <input type="checkbox" name="languages",value="JavaScript">
        <label for="javascript">JavaScript</label><br><br>

        <botton type="reset">Reset</botton>
        <button type="submit">Submit</button>



    </form>

    <script src="script.js"></script>
</body>
</html>
